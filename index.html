<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SUSBI - Teste Android</title><style>
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#16405c,#030913 75%);font-family:system-ui;color:#def9ff;text-align:center}main{max-width:550px;margin:auto;padding:15px}h1{letter-spacing:.18em;color:#7be7ff}#palco{height:min(62dvh,550px);position:relative;overflow:hidden;border:1px solid #38bde9;border-radius:24px;background:#071522 url('rosto.jpg') center/contain no-repeat}video{height:100%;width:100%;object-fit:contain}#palco.falando{box-shadow:0 0 36px #22d8ff88}#palco.ouvindo{box-shadow:0 0 36px #00ffa088}#anel{position:absolute;inset:5%;border:1px solid #42dcff44;border-radius:50%;pointer-events:none;animation:pulse 4s infinite}#ondas{position:absolute;bottom:8%;left:50%;transform:translateX(-50%);display:flex;gap:5px;align-items:center;height:35px}#ondas i{width:5px;height:8px;background:#64eaff;border-radius:4px}#palco.falando #ondas i,#palco.ouvindo #ondas i{animation:onda .4s infinite alternate}#ondas i:nth-child(2){animation-delay:.13s}#ondas i:nth-child(3){animation-delay:.23s}#ondas i:nth-child(4){animation-delay:.08s}button{font-size:1rem;padding:12px;border:1px solid #3cbde7;background:#12405a;color:white;border-radius:13px;margin:4px}#status{color:#8beaff;font-weight:700}#msg{min-height:3em;line-height:1.5}small{color:#a7c8d2}@keyframes onda{to{height:30px}}@keyframes pulse{50%{opacity:.3;transform:scale(1.02)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style></head><body><main><h1>SUSBI</h1><div id="palco"><video id="video" src="susbi.mp4" poster="rosto.jpg" muted autoplay loop playsinline preload="metadata"></video><div id="anel"></div><div id="ondas"><i></i><i></i><i></i><i></i></div></div><p id="status">Em repouso</p><button id="play">▶ Mostrar rosto</button><button id="listen">🎙 Ouvir</button><button id="talk">🔊 Falar</button><button id="stop">Parar</button><p id="msg">Para usar o microfone, abra esta página por HTTPS ou localhost e autorize o acesso.</p><small>Protótipo de teste: ainda não há IA conectada nem sincronização labial real.</small></main><script>
const v=document.querySelector('#video'),p=document.querySelector('#palco'),status=document.querySelector('#status'),msg=document.querySelector('#msg');let rec=null,seq=0;
function state(s,t){p.className=s;status.textContent=t}
function stop(){seq++;if(rec){try{rec.abort()}catch(e){}rec=null}if(window.speechSynthesis)speechSynthesis.cancel();state('','Em repouso')}
document.querySelector('#stop').onclick=()=>{stop();msg.textContent='Aguardando.'};
document.querySelector('#play').onclick=async()=>{try{await v.play();msg.textContent='Imagem e vídeo da SUSBI carregados.'}catch(e){msg.textContent='A imagem fixa continua visível. O vídeo não iniciou: '+e.message}};
v.onerror=()=>{v.style.display='none';msg.textContent='Vídeo indisponível; exibindo a imagem fixa da SUSBI.'};
function speak(t){stop();const id=seq;state('falando','Falando');msg.textContent=t;if(!window.speechSynthesis){msg.textContent+=' Voz indisponível.';return}const u=new SpeechSynthesisUtterance(t);u.lang='pt-BR';u.rate=.92;u.onend=u.onerror=()=>{if(id===seq)state('','Em repouso')};speechSynthesis.speak(u)}
document.querySelector('#talk').onclick=()=>speak('Olá! Eu sou a Susbi, sua assistente virtual do Lembra Aí. Estou pronta para conversar com você.');
document.querySelector('#listen').onclick=()=>{stop();if(!window.isSecureContext){msg.textContent='O microfone exige uma página HTTPS ou localhost. Abrir o HTML diretamente no celular pode bloquear a permissão.';return}const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){msg.textContent='Este navegador não oferece reconhecimento de voz. Tente o Chrome atualizado.';return}const r=new SR();rec=r;r.lang='pt-BR';r.onresult=e=>{rec=null;speak('Eu ouvi: '+e.results[0][0].transcript)};r.onerror=e=>{rec=null;state('','Em repouso');msg.textContent='Microfone: '+e.error+'. Confira a permissão do site nas configurações do Chrome.'};r.onend=()=>{if(rec===r){rec=null;state('','Em repouso')}};try{r.start();state('ouvindo','Ouvindo');msg.textContent='Fale agora.'}catch(e){msg.textContent=e.message}};
</script></body></html>
